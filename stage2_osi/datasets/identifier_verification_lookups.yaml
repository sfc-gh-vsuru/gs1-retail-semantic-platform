# OSI Dataset: Verification Lookup Service
# Contributed by: GS1 (via Snowflake Semantic Views)
# Apache Ossie (Incubating) — Open Semantic Interchange
# License: Apache 2.0
#
# This dataset represents a generic pattern for identifier verification
# lookups. Derived from the "Verified by GS1" service but contains
# NO actual lookup data, member identifiers, or proprietary values.

osi_version: "0.1"
type: dataset

dataset:
  name: identifier_verification_lookups
  description: >
    A dataset capturing verification requests against a trusted identifier
    registry. Each row represents a single lookup event where an external
    party queries whether an identifier (product or location) is valid,
    invalid, or not found. Used for trust scoring, adoption monitoring,
    and counterfeit detection analytics.
  domain: retail_supply_chain
  source_standard: "Verified by GS1 (GEPIR successor)"
  license_note: "Structure only — no actual identifiers or lookup data included"

  columns:
    - name: lookup_id
      data_type: VARCHAR(50)
      role: primary_key
      description: "Unique identifier for each verification request"

    - name: lookup_timestamp
      data_type: TIMESTAMP
      role: time_dimension
      description: "When the verification request was made"

    - name: lookup_type
      data_type: VARCHAR(20)
      role: dimension
      description: "Type of identifier being verified (e.g., PRODUCT_ID, LOCATION_ID)"

    - name: identifier_queried
      data_type: VARCHAR(14)
      role: dimension
      description: "The identifier being looked up (anonymised in export)"

    - name: lookup_result
      data_type: VARCHAR(20)
      role: dimension
      description: "Outcome: VALID, INVALID, or NOT_FOUND"

    - name: company_name_returned
      data_type: VARCHAR(255)
      role: dimension
      description: "Company name returned for valid lookups (anonymised in export)"

    - name: requester_type
      data_type: VARCHAR(50)
      role: dimension
      description: "Category of the requesting party (RETAILER, CONSUMER, REGULATOR)"

    - name: requester_country
      data_type: VARCHAR(3)
      role: dimension
      description: "ISO 3166-1 alpha-2 country code of the requester"

  metrics_applicable:
    - verification_success_rate
    - lookup_volume_by_country
    - not_found_rate
